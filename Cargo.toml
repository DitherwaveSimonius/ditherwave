[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/raw",
    "crates/vector",
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/recipe",
    "apps/cli",
    "apps/desktop/src-tauri",
    "sdk/plugin-sdk-rust",
    "examples/plugins/invert",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DitherwaveSimonius/ditherwave"

[workspace.dependencies]
ditherwave-core = { path = "crates/core" }
ditherwave-raw = { path = "crates/raw" }
ditherwave-vector = { path = "crates/vector" }
ditherwave-plugin-api = { path = "crates/plugin-api" }
ditherwave-plugin-host = { path = "crates/plugin-host" }
ditherwave-recipe = { path = "crates/recipe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
